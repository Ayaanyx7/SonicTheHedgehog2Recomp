name: Build Android APK via CMake

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & Tools
      uses: android-actions/setup-android@v3

    - name: Install Android NDK & Build Components
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

    # NEW STEP: Fetch pre-compiled Android SDL2 development libraries
    - name: Fetch and Setup SDL2 for Android
      run: |
        curl -L https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz -o sdl2.android.tar.gz
        tar -xzf sdl2-android.tar.gz
        # Create an absolute environment variable pointing to the extracted folder
        echo "SDL2_ANDROID_DIR=${{ github.workspace }}/SDL2-2.28.5" >> $GITHUB_ENV

    # UPDATED STEP: Point CMAKE_PREFIX_PATH / SDL2_DIR to our downloaded package
    - name: Configure CMake for Android (arm64-v8a)
      run: |
        cmake -S . -B build_android \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_RECOMPILED_CODE=ON \
          -DSDL2_DIR=${{ env.SDL2_ANDROID_DIR }}/lib/arm64-v8a/cmake/SDL2 \
          -DCMAKE_PREFIX_PATH=${{ env.SDL2_ANDROID_DIR }}

    - name: Compile Native Libraries via CMake
      run: cmake --build build_android --config Release

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x android/gradlew
      continue-on-error: true

    - name: Assemble Final APK via Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic2Recomp-Android-Debug
        path: android/app/build/outputs/apk/debug/*.apk
