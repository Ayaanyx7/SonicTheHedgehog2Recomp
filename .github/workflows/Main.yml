name: Build Android APK via CMake

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & Tools
      uses: android-actions/setup-android@v3

    - name: Install Android NDK & Build Components
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Setup Android dependencies
      run: |
        python3 android/tools/setup_deps.py

    - name: Build Recompiler and Process Sonic 2 ROM
      env:
        ROM_URL: ${{ secrets.SONIC2_ROM_URL }}
      run: |
        # 1. Install Ninja build tool (required for the Linux build command)
        sudo apt-get update && sudo apt-get install -y ninja-build
        
        # 2. Build the GenesisRecomp compiler tool from the source directory
        cmake -S segagenesisrecomp/recompiler -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        ninja -C build
        
        # 3. Download the Sonic 2 ROM straight into your game's subfolder
        curl -L "$ROM_URL" -o segagenesisrecomp/sonicthehedgehog2/sonic2.bin
        
        # 4. Navigate into the game directory
        cd segagenesisrecomp/sonicthehedgehog2
        
        # 4.5. funny creation thingy
        mkdir -p ../../android/generated/sonic2
        
        # 5. Execute the freshly built compiler
        ../../build/GenesisRecomp sonic2.bin --game game.toml --output-dir ../../android/generated/sonic2

    # UPDATED STEP: Point CMAKE_PREFIX_PATH / SDL2_DIR to our downloaded package
    - name: Configure CMake for Android (arm64-v8a)
      run: |
        cmake -S android/app/jni -B build_android \
        -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
        -DANDROID_ABI=arm64-v8a \
        -DANDROID_PLATFORM=android-21 \
        -DCMAKE_BUILD_TYPE=Release

    - name: Compile Native Libraries via CMake
      run: cmake --build build_android --config Release

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x android/gradlew
      continue-on-error: true

    - name: Assemble Final APK via Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic2Recomp-Android-Debug
        path: android/app/build/outputs/apk/debug/*.apk
